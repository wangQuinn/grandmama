<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grandma's Bakery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1EADA; --paper:#FFFCF3; --ink:#1A1A1A; --soft:#474747;
  --blue:#1A62AD; --blue-ink:#FFFFFF; --green:#1E9B45; --yellow:#F0B33C; --orange:#E1713D;
  --t0:#D6E5F5; --t1:#D6EEDD; --t2:#FBE5B6; --t3:#F8D8C6;
  --okbg:#DAF0E1; --ok:#0D5527; --nobg:#FBDFD1; --no:#862904;
  --line:#1A1A1A; --shadow:0 14px 30px rgba(50,35,10,.16);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15171C; --paper:#20242C; --ink:#FBF6E9; --soft:#CFCABB;
    --blue:#6FB2F2; --blue-ink:#0B1A2B; --green:#5FD38A; --yellow:#F5C762; --orange:#F2955F;
    --t0:#22364D; --t1:#1F3D2B; --t2:#463818; --t3:#48291B;
    --okbg:#1E4A31; --ok:#C3F2D3; --nobg:#55250F; --no:#FFD2BC; --line:#FBF6E9; --shadow:0 14px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#15171C; --paper:#20242C; --ink:#FBF6E9; --soft:#CFCABB;
  --blue:#6FB2F2; --blue-ink:#0B1A2B; --green:#5FD38A; --yellow:#F5C762; --orange:#F2955F;
  --t0:#22364D; --t1:#1F3D2B; --t2:#463818; --t3:#48291B;
  --okbg:#1E4A31; --ok:#C3F2D3; --nobg:#55250F; --no:#FFD2BC; --line:#FBF6E9; --shadow:0 14px 30px rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,"Segoe UI",Arial,sans-serif;font-weight:500;font-size:21px;line-height:1.5}
h1,h2,.display{font-family:Montserrat,"Segoe UI",Arial,sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.04em;line-height:1.05;margin:0}
h1{font-size:clamp(34px,5.6vw,60px)}
h2{font-size:28px}
.serif{font-family:"Playfair Display",Georgia,serif;font-weight:700;letter-spacing:0;text-transform:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto;padding:8px 22px 150px}

header.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px 28px;padding:22px 22px 10px;max-width:1100px;margin:0 auto}
.brand{margin-right:auto;font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:24px;line-height:1.15;display:flex;align-items:center;gap:14px}
.brand .sq{width:22px;height:22px;background:var(--blue)}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:none;background:none;padding:10px 12px 8px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;border-bottom:4px solid transparent}
.tab .e{font-size:24px}
.tab[aria-current="page"]{border-bottom-color:var(--blue)}

/* hero, slide-style */
.hero{position:relative;background:var(--paper);box-shadow:var(--shadow);padding:44px 120px 44px 44px;margin:14px 0 34px;display:grid;grid-template-columns:minmax(180px,240px) 1fr;gap:20px 40px;align-items:end;min-height:260px}
.hero .lbl{font-size:24px;line-height:1.2}
.hero p{color:var(--soft);font-size:19px;margin:16px 0 0;max-width:30ch}
.hero h1{text-align:left}
.vert{position:absolute;right:30px;top:36px;writing-mode:vertical-rl;font-weight:800;letter-spacing:.18em;text-transform:uppercase;font-size:20px}
.hero .blk{position:absolute;right:30px;bottom:36px;width:42px;height:28px;background:var(--blue)}
.hero .mark{position:absolute;left:44px;top:34px;width:44px;height:2px;background:var(--ink);transform:rotate(-35deg);transform-origin:left}
.hero.y .blk{background:var(--yellow)} .hero.g .blk{background:var(--green)}

.lede{color:var(--soft);margin:8px 0 22px;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:24px}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(440px,1fr))}
.card{background:var(--paper);border:3px solid transparent;box-shadow:var(--shadow);padding:22px;position:relative}
.card.on{border-color:var(--blue)}
.card.on::after{content:"";position:absolute;right:16px;bottom:16px;width:22px;height:16px;background:var(--blue)}
.slide{display:grid;grid-template-columns:42% 1fr;padding:0;min-height:250px}
.tile{display:grid;place-items:center;font-size:96px;line-height:1}
.t0{background:var(--t0)} .t1{background:var(--t1)} .t2{background:var(--t2)} .t3{background:var(--t3)}
.slide .body{padding:22px 22px 22px 24px;display:flex;flex-direction:column}
.part{display:flex;align-items:baseline;gap:6px;font-weight:800;line-height:1}
.part span{font-size:18px}
.part b{font-size:56px;letter-spacing:-.02em}
.pic{font-size:64px;line-height:1;display:block;margin-bottom:10px}
.name{font-weight:700;font-size:25px;line-height:1.2;margin-top:10px}
.sub{color:var(--soft);font-size:18px}
.stepper{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:16px;gap:10px}
.round{width:64px;height:64px;border-radius:8px;border:3px solid var(--line);background:var(--paper);font-size:34px;font-weight:700;display:grid;place-items:center;flex:none;line-height:1}
.round.plus{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.round:disabled{opacity:.3;cursor:not-allowed}
.count{font-size:42px;font-weight:800;text-align:center;min-width:2ch;line-height:1}
.count small{display:block;font-size:15px;font-weight:600;color:var(--soft);margin-top:4px}

.btn{border:3px solid var(--line);background:var(--paper);border-radius:8px;padding:14px 26px;font-weight:700;font-size:21px;min-height:66px}
.btn.big{background:var(--blue);color:var(--blue-ink);border-color:var(--blue);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:24px;padding:16px 38px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:active:not(:disabled){transform:translateY(2px)}
.linkish{background:none;border:none;color:var(--ink);text-decoration:underline;text-underline-offset:4px;font-size:19px;padding:10px 0;font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:16px;margin-top:28px;align-items:center}

.dock{position:fixed;left:0;right:0;bottom:0;padding:14px 22px calc(14px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:3px solid var(--line);display:flex;justify-content:center;align-items:center;gap:24px;z-index:5}
.dock .sum{font-size:19px;font-weight:600}

.sec{display:flex;align-items:baseline;gap:18px;margin:40px 0 16px;flex-wrap:wrap}
.sec .part b{font-size:48px}
.sec h2{font-size:24px}
.rows{display:flex;flex-direction:column;gap:12px}
.row{display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:16px;background:var(--paper);box-shadow:0 4px 12px rgba(50,35,10,.08);padding:10px 18px 10px 10px;border-left:6px solid var(--green)}
.row.short{border-left-color:var(--orange)}
.row .e{font-size:44px;text-align:center;align-self:stretch;display:grid;place-items:center}
.chip{padding:6px 14px;font-weight:700;font-size:18px;white-space:nowrap;border-radius:4px}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.no{background:var(--nobg);color:var(--no)}
.cartrow{grid-template-columns:48px 60px 1fr auto;border-left-color:var(--blue);cursor:pointer}
.cartrow input[type=checkbox]{width:36px;height:36px;accent-color:var(--blue)}
.price{font-weight:800;font-size:26px}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px;padding-top:14px;border-top:3px solid var(--line);font-size:24px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.note{font-size:17px;color:var(--soft);margin-top:10px;max-width:62ch}
.ai{margin-top:22px;border-left:6px solid var(--yellow);padding:14px 18px;background:var(--paper)}
.ai ul{margin:8px 0 0;padding-left:24px}

.pcard.low{border-color:var(--orange)}
.pcard .amt{font-weight:800;font-size:40px;margin-top:6px;line-height:1.1}
.pcard .amt small{font-size:19px;font-weight:700}
.lowtag{display:inline-block;margin-top:8px}
.addcard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:230px;border:3px dashed var(--line);box-shadow:none;font-weight:700;font-size:22px;background:transparent}
.addcard .pic{margin:0}

.meter{height:18px;border:3px solid var(--line);overflow:hidden;margin:14px 0 6px;background:var(--bg)}
.meter i{display:block;height:100%;background:var(--green)}

.deck{position:relative;height:460px;max-width:420px;margin:10px auto 0}
.swipe{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;touch-action:none;user-select:none;transition:transform .25s ease}
.swipe.behind{transform:scale(.94) translateY(18px);z-index:0}
.swipe.top{z-index:1}
.swipe .sup{font-size:56px}
.swipe .deal{font-weight:800;font-size:46px;margin-top:10px}
.stamp{position:absolute;top:24px;font-weight:800;font-size:28px;letter-spacing:.1em;border:4px solid;padding:2px 14px;opacity:0}
.stamp.yes{left:24px;color:var(--ok);background:var(--okbg);transform:rotate(-12deg)}
.stamp.nope{right:24px;color:var(--no);background:var(--nobg);transform:rotate(12deg)}
.swipebtns{display:flex;justify-content:center;gap:40px;margin-top:26px}
.swipebtns .round{width:92px;height:92px;font-size:40px}

.live .stage{display:grid;grid-template-columns:1fr 1fr;background:var(--paper);box-shadow:var(--shadow);margin-top:14px;min-height:420px}
.live .stage .art{background:var(--yellow);display:grid;place-items:center;font-size:140px}
.live .stage .txt{padding:40px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.live .onair{align-self:flex-start;background:var(--orange);color:#1A1A1A;padding:4px 14px;font-weight:800;font-size:16px;letter-spacing:.12em;text-transform:uppercase}
.livelist{display:flex;flex-direction:column;gap:6px;margin:6px 0 10px;font-weight:700}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;align-self:flex-start}

dialog{border:none;background:var(--paper);color:var(--ink);padding:0;width:min(640px,94vw);max-height:90vh;box-shadow:0 20px 60px rgba(0,0,0,.35);border-top:10px solid var(--blue)}
dialog::backdrop{background:rgba(20,20,20,.55)}
.dlg{padding:26px;overflow:auto;max-height:88vh}
.field{display:flex;flex-direction:column;gap:6px;margin-top:16px;font-weight:700}
.field input,.field select{border:3px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--bg);min-height:60px;font-weight:500;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.emojis{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px;margin-top:8px}
.emojis button{font-size:34px;height:62px;border:3px solid transparent;border-radius:8px;background:var(--bg)}
.emojis button[aria-pressed="true"]{border-color:var(--blue);background:var(--paper)}
.irow{display:grid;grid-template-columns:1fr 120px 56px;gap:10px;margin-top:10px;align-items:center}
.irow select,.irow input{border:3px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);min-height:56px;width:100%}
.x{width:56px;height:56px;border-radius:8px;border:3px solid var(--line);background:var(--bg);font-size:22px}

.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:14px 26px;font-weight:700;z-index:20;max-width:90vw;text-align:center}
@media (max-width:720px){
  body{font-size:19px}
  .hero{grid-template-columns:1fr;padding:36px 70px 30px 26px;min-height:0}
  .hero .mark{left:26px}
  .vert{right:20px;font-size:16px}
  .hero .blk{right:20px}
  .grid.wide{grid-template-columns:1fr}
  .slide{grid-template-columns:38% 1fr;min-height:220px}
  .tile{font-size:70px}
  .tab{padding:8px 6px;font-size:15px;flex-direction:column;gap:2px;flex:1}
  nav.tabs{width:100%;gap:0}
  .row{grid-template-columns:56px 1fr}
  .row .chip{grid-column:2;justify-self:start}
  .cartrow{grid-template-columns:44px 52px 1fr}
  .cartrow .price{grid-column:3}
  .live .stage{grid-template-columns:1fr}
  .live .stage .art{min-height:200px;font-size:110px}
  .dock{gap:14px}
  .dock .sum{display:none}
}
@media (prefers-reduced-motion:reduce){.swipe{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span>Grandma's<br>Bakery</span></div>
  <nav class="tabs" aria-label="Sections"></nav>
</header>
<main class="wrap" id="app" aria-live="polite"></main>
<div id="dock"></div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

<script>
/* ---------- starter data ---------- */
const DEFAULTS = {
  v:1,
  ingredients:[
    {id:"flour",name:"All-purpose flour",emoji:"🌾",unit:"cups",qty:14,low:6,price:0.35},
    {id:"sugar",name:"White sugar",emoji:"🧊",unit:"cups",qty:6,low:3,price:0.45},
    {id:"brown",name:"Brown sugar",emoji:"🟫",unit:"cups",qty:2,low:2,price:0.55},
    {id:"butter",name:"Butter",emoji:"🧈",unit:"sticks",qty:6,low:4,price:1.40},
    {id:"eggs",name:"Large eggs",emoji:"🥚",unit:"eggs",qty:10,low:6,price:0.38},
    {id:"milk",name:"Whole milk",emoji:"🥛",unit:"cups",qty:4,low:2,price:0.30},
    {id:"chips",name:"Chocolate chips",emoji:"🍫",unit:"cups",qty:2,low:2,price:1.60},
    {id:"vanilla",name:"Vanilla extract",emoji:"🌼",unit:"tsp",qty:8,low:4,price:0.50},
    {id:"soda",name:"Baking soda",emoji:"🫙",unit:"tsp",qty:20,low:6,price:0.05},
    {id:"salt",name:"Salt",emoji:"🧂",unit:"tsp",qty:30,low:6,price:0.02},
    {id:"cinnamon",name:"Ground cinnamon",emoji:"🪵",unit:"tsp",qty:5,low:4,price:0.20},
    {id:"apples",name:"Baking apples",emoji:"🍎",unit:"apples",qty:4,low:6,price:0.70},
    {id:"berries",name:"Blueberries",emoji:"🫐",unit:"cups",qty:3,low:2,price:2.20},
    {id:"lemons",name:"Lemons",emoji:"🍋",unit:"lemons",qty:3,low:2,price:0.80},
    {id:"bananas",name:"Ripe bananas",emoji:"🍌",unit:"bananas",qty:5,low:3,price:0.30},
    {id:"cream",name:"Heavy cream",emoji:"🥛",unit:"cups",qty:2,low:1,price:1.00},
    {id:"cornstarch",name:"Cornstarch",emoji:"🫙",unit:"tbsp",qty:12,low:3,price:0.10},
    {id:"powdered",name:"Powdered sugar",emoji:"🧊",unit:"cups",qty:2,low:0.5,price:0.60},
    {id:"vanillabean",name:"Vanilla beans",emoji:"🌼",unit:"beans",qty:2,low:1,price:3.00},
    {id:"almonds",name:"Sliced almonds",emoji:"🌰",unit:"tbsp",qty:12,low:6,price:0.15},
    {id:"honey",name:"Honey",emoji:"🍯",unit:"tbsp",qty:16,low:4,price:0.20},
    {id:"condensed",name:"Sweetened condensed milk",emoji:"🥫",unit:"cups",qty:1.25,low:1,price:2.00},
    {id:"compote",name:"Berry compote",emoji:"🫐",unit:"cups",qty:1,low:1,price:2.50},
    {id:"strawberries",name:"Fresh strawberries",emoji:"🍓",unit:"lbs",qty:1,low:1,price:3.00},
    {id:"graham",name:"Graham cracker crumbs",emoji:"🍪",unit:"cups",qty:1.5,low:1,price:0.80},
    {id:"creamcheese",name:"Cream cheese",emoji:"🧀",unit:"8-oz blocks",qty:2,low:2,price:2.50}
  ],
  recipes:[
    // {id:"cookies",name:"Chocolate chip cookies",emoji:"🍪",makes:"24 cookies",items:[["flour",2.25],["butter",2],["sugar",0.75],["brown",0.75],["eggs",2],["vanilla",1],["soda",1],["salt",1],["chips",2]]},
    {id:"parfait",name:"Berry-licious parfait",emoji:"🍨",makes:"3 parfaits",items:[["almonds",6],["honey",3],["cream",2],["lemons",0.33],["vanilla",1],["condensed",1.75],["compote",1]]},
    {id:"creampuffs",name:"Cream puffs",emoji:"🧁",makes:"20 cream puffs",items:[["milk",1],["cream",1],["sugar",0.5],["vanillabean",1],["salt",0.5],["eggs",9],["cornstarch",3],["butter",1.5],["flour",1],["powdered",0.25]]},
    {id:"pudding",name:"Vanilla pudding",emoji:"🍮",makes:"5 servings",items:[["sugar",0.33],["cornstarch",3],["salt",0.5],["milk",2],["butter",0.125],["vanilla",1]]},
    {id:"cheesecake",name:"Strawberry cheesecake",emoji:"🍰",makes:"5 servings",items:[["strawberries",1],["sugar",0.25],["lemons",0.5],["graham",1.5],["butter",0.5],["creamcheese",2],["condensed",1.25],["vanilla",1]]},
    
    // {id:"pie",name:"Apple pie",emoji:"🥧",makes:"1 pie",items:[["flour",2.5],["butter",2],["sugar",0.75],["apples",6],["cinnamon",1],["salt",1]]},
    // {id:"muffins",name:"Blueberry muffins",emoji:"🧁",makes:"12 muffins",items:[["flour",2],["sugar",1],["butter",1],["eggs",2],["milk",0.5],["berries",2],["soda",1],["salt",0.5]]},
    // {id:"lemon",name:"Lemon loaf",emoji:"🍋",makes:"1 loaf",items:[["flour",1.5],["sugar",1],["butter",1],["eggs",2],["lemons",2],["milk",0.5]]},
    // {id:"banana",name:"Banana bread",emoji:"🍞",makes:"1 loaf",items:[["flour",2],["brown",0.75],["butter",1],["eggs",2],["bananas",3],["soda",1],["salt",0.5],["cinnamon",1]]}
  ],
  plan:{},
  customers:[
    {id:"c1",name:"Mrs. Patel",points:72,treats:1},
    {id:"c2",name:"Tommy from next door",points:18,treats:0}
  ],
  deals:{},
  lastMorning:"",
  channel:"bakingwgranny",
  orders:[]
};
const SUPPLIERS=[
  {id:"costco",name:"Costco",emoji:"🏬",base:0.80,fresh:0.95},
  {id:"walmart",name:"Walmart",emoji:"🛒",base:0.92,fresh:0.98},
  {id:"bulkbarn",name:"Bulk Barn",emoji:"🫘",base:0.86,fresh:1.15},
  {id:"farm",name:"Local farm stand",emoji:"🚜",base:1.10,fresh:0.74}
];
const FRESH=["eggs","milk","apples","berries","lemons","bananas","butter","cream","strawberries","creamcheese"];
const EMOJIS=["🌾","🧊","🟫","🧈","🥚","🥛","🍫","🌼","🫙","🧂","🪵","🍎","🍏","🫐","🍓","🍒","🍋","🍌","🥕","🎃","🥜","🌰","🥥","🍯","🍑","🍐","🧀","🍞","🥐","🥖","🍪","🥧","🧁","🍰","🎂","🍩","🥨","🌀","🍮","🫓","🍊","🍍","🫚","🧃","☕","🍵"];

/* ---------- state + storage ---------- */
let S = load();
let ui = {tab:"bake", stage:"plan", cart:[], ai:null, aiBusy:false, alt:{}, lastBake:[], swipeIdx:0, morningOpen:false};
let db=null, docRef=null, sample=null, saveTimer=null;

function load(){
  try{ const raw=localStorage.getItem("grandma-bakery"); if(raw) return Object.assign(structuredClone(DEFAULTS),JSON.parse(raw)); }catch(e){}
  return structuredClone(DEFAULTS);
}
function save(){
  try{ localStorage.setItem("grandma-bakery",JSON.stringify(S)); }catch(e){}
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{ if(docRef){ try{ await docRef.set({state:JSON.stringify(S)}); }catch(e){} } },900);
}
(async()=>{
  if(!window.claude||!window.claude.use) return;
  try{
    sample = await window.claude.use("sample");
    db = await window.claude.use("db");
    const user = await window.claude.use("user");
    if(db && user){
      const id = await user.id();
      if(id){
        docRef = db.collection("data/users/"+id).doc("bakery");
        const snap = await docRef.get();
        if(snap.exists && snap.data() && snap.data().state){
          S = Object.assign(structuredClone(DEFAULTS), JSON.parse(snap.data().state));
        } else { await docRef.set({state:JSON.stringify(S)}); }
      }
    }
  }catch(e){}
  render();
})();

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ING=id=>S.ingredients.find(i=>i.id===id);
const money=n=>"$"+n.toFixed(2);
function qty(n){
  n=Math.round(n*100)/100; if(n<=0) return "0";
  const w=Math.floor(n), f=Math.round((n-w)*100);
  const m={25:"¼",50:"½",75:"¾",33:"⅓",67:"⅔"};
  if(f===0) return String(w);
  if(m[f]) return (w?w:"")+m[f];
  return n.toFixed(1).replace(/\.0$/,"");
}
const today=()=>new Date().toISOString().slice(0,10);
const uid=p=>p+Math.random().toString(36).slice(2,8);
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h}
function priceAt(sup,ing){
  const f=FRESH.includes(ing.id)?sup.fresh:sup.base;
  const wobble=0.92+(hash(sup.id+ing.id)%17)/100;
  return Math.max(0.01,Math.round((ing.price||1)*f*wobble*100)/100);
}
function bestDeal(ing){
  const ok=SUPPLIERS.filter(s=>S.deals[s.id+"|"+ing.id]!=="skip");
  const pool=(ok.filter(s=>S.deals[s.id+"|"+ing.id]==="like").length?ok.filter(s=>S.deals[s.id+"|"+ing.id]==="like"):ok);
  const list=(pool.length?pool:SUPPLIERS).map(s=>({s,p:priceAt(s,ing)})).sort((a,b)=>a.p-b.p);
  return list[0];
}
function needsFor(plan){
  const need={};
  for(const [rid,n] of Object.entries(plan)){
    if(!n) continue; const r=S.recipes.find(x=>x.id===rid); if(!r) continue;
    for(const [iid,a] of r.items){ need[iid]=(need[iid]||0)+a*n; }
  }
  return need;
}
function maxBatches(r){
  let m=Infinity;
  for(const [iid,a] of r.items){ const i=ING(iid); if(!i||a<=0) continue; m=Math.min(m,Math.floor((i.qty+1e-9)/a)); }
  return m===Infinity?0:m;
}
function toast(msg){
  const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2600);
}

function buildCart(){
  const need=needsFor(S.plan), cart=[];
  for(const [iid,n] of Object.entries(need)){
    const i=ING(iid); if(!i) continue;
    const short=Math.max(0,n-i.qty);
    if(short>0){
      const buy=Math.ceil(short);
      const d=bestDeal(i);
      cart.push({iid,buy,sup:d.s.id,unit:d.p,total:Math.round(buy*d.p*100)/100,required:short>0,on:true});
    }
  }
  return cart;
}

  return out;
}

/* ---------- swipe gestures ---------- */
function wireSwipe(){
  const el=$("#topcard"); if(!el) return;
  let x0=null,dx=0;
  el.addEventListener("pointerdown",e=>{x0=e.clientX;el.setPointerCapture(e.pointerId);el.style.transition="none"});
  el.addEventListener("pointermove",e=>{if(x0===null)return;dx=e.clientX-x0;el.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;
    el.querySelector(".yes").style.opacity=Math.max(0,dx/120);el.querySelector(".nope").style.opacity=Math.max(0,-dx/120)});
  const end=()=>{if(x0===null)return;x0=null;el.style.transition="";
    if(Math.abs(dx)>110) decide(dx>0?"like":"skip"); else {el.style.transform="";el.querySelectorAll(".stamp").forEach(s=>s.style.opacity=0)} dx=0};
  el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);
}
function decide(v){
  const d=deckList()[0]; if(!d) return;
  const el=$("#topcard");
  if(el){ el.style.transform=`translateX(${v==="like"?600:-600}px) rotate(${v==="like"?25:-25}deg)`; }
  setTimeout(()=>{S.deals[d.s.id+"|"+d.i.id]=v;save();render();},200);
}

/* ---------- AI ---------- */
async function askAI(kind){
  if(!sample) return;
  ui.aiBusy=true; render();
  try{
    let res;
    if(kind==="prices"){
      const list=ui.cart.map(c=>{const i=ING(c.iid);return {item:i.name,amount:c.buy+" "+i.unit,options:SUPPLIERS.map(s=>({store:s.name,price_each:priceAt(s,i)}))}});
      res=await sample.json(`You are helping a grandmother who runs a small home bakery save money on ingredients. Here is her shopping list with estimated prices at nearby stores: ${JSON.stringify(list)}.
Give warm, plain-language advice in short sentences a 75-year-old can read easily. Return ONLY JSON: {"summary":"one sentence on the cheapest way to shop this list, e.g. which one or two stores","tips":["2 to 4 short money-saving tips specific to these ingredients, like buying in bulk, freezing butter, or seasonal fruit"]}`,{modelTier:"quick"});
      ui.ai=`<div class="name" style="font-size:22px">🤖 ${esc(res.summary||"")}</div><ul>${(res.tips||[]).map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`;
    } else {
      const pantry=S.ingredients.filter(i=>i.qty>0).map(i=>`${qty(i.qty)} ${i.unit} ${i.name}`);
      res=await sample.json(`A grandmother who runs a small home bakery has these ingredients: ${pantry.join("; ")}. Suggest 3 simple baked goods she could make using only these (pantry staples like water are fine). Use plain, friendly language. Return ONLY JSON: {"ideas":[{"emoji":"one food emoji","name":"short name","why":"one short sentence on what it uses"}]}`,{modelTier:"quick"});
      ui.ai=`<div class="name" style="font-size:22px">🤖 Other things you could make</div><ul>${(res.ideas||[]).map(d=>`<li>${esc(d.emoji||"")} <b>${esc(d.name)}</b>: ${esc(d.why)}</li>`).join("")}</ul>`;
    }
  }catch(e){
    if(e&&e.code==="not_granted"){ sample=null; ui.ai=null; }
    else ui.ai=`<div class="sub">Claude couldn't answer just now. Try the button again in a minute.</div><button class="btn" data-act="${kind==="prices"?"aiPrices":"aiIdeas"}" style="margin-top:10px">Try again</button>`;
  }
  ui.aiBusy=false; render();
}

/* ---------- baking ---------- */
function deduct(plan){
  const need=needsFor(plan);
  for(const [iid,n] of Object.entries(need)){ const i=ING(iid); if(i) i.qty=Math.max(0,Math.round((i.qty-n)*100)/100); }
  ui.lastBake=Object.entries(plan).filter(([,n])=>n).map(([rid,n])=>{const r=S.recipes.find(x=>x.id===rid);return {emoji:r.emoji,name:r.name,n}});
  S.plan={}; save();
  ui.stage="live"; ui.ai=null; render(); window.scrollTo(0,0);
}

    <button class="linkish" data-act="addItem">+ Add another ingredient</button>
    <div class="actions"><button class="btn big" data-act="saveRec">Save</button><button class="btn" data-act="closeDlg">Cancel</button>
    ${S.recipes.some(x=>x.id===draft.id)?`<button class="linkish" data-act="delRec">Remove recipe</button>`:""}</div>`);
}
function syncRec(){
  const n=$("#r_name"); if(n) draft.name=n.value; const m=$("#r_makes"); if(m) draft.makes=m.value;
  document.querySelectorAll(".r_ing").forEach(s=>draft.items[+s.dataset.k][0]=s.value);
  document.querySelectorAll(".r_amt").forEach(s=>draft.items[+s.dataset.k][1]=parseFloat(s.value)||0);
}

/* ---------- events ---------- */
document.addEventListener("change",e=>{
  if(e.target.matches('[data-act="cartToggle"]')){ ui.cart[+e.target.dataset.k].on=e.target.checked; render(); }
  if(e.target.id==="chan"){ S.channel=e.target.value.trim().replace(/[^A-Za-z0-9_]/g,"")||"bakingwgranny"; save(); render(); }
});
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act, id=el.dataset.id;
  if(a==="cartToggle"||a==="chan") return;
  switch(a){
    case "tab": ui.tab=id; ui.ai=null; if(id==="bake"&&ui.stage==="live") ui.stage="plan"; render(); window.scrollTo(0,0); break;
    case "inc": S.plan[id]=(S.plan[id]||0)+1; save(); render(); break;
    case "dec": S.plan[id]=Math.max(0,(S.plan[id]||0)-1); save(); render(); break;
    case "letsbake": ui.cart=buildCart(); ui.ai=null; ui.stage="check"; render(); window.scrollTo(0,0); break;
    case "back": ui.stage="plan"; render(); break;
    case "backcheck": ui.stage="check"; ui.ai=null; render(); break;
    case "startbake": deduct(S.plan); break;
    case "buy": {
      const lines=ui.cart.filter(c=>c.on);
      for(const c of lines){ const i=ING(c.iid); i.qty=Math.round((i.qty+c.buy)*100)/100; }
      S.orders.push({date:today(),items:lines.map(c=>({item:ING(c.iid).name,amount:c.buy,store:c.sup,cost:c.total})),total:lines.reduce((x,c)=>x+c.total,0)});
      const stillShort=Object.entries(needsFor(S.plan)).some(([iid,n])=>ING(iid).qty+1e-9<n);
      toast("Order saved and added to your pantry");
      if(stillShort){ ui.cart=buildCart(); render(); toast("You unticked something you need. Tick it or press No."); }
      else deduct(S.plan);
      break; }
    case "nobuy":
      if(ui.cart.some(c=>c.required)){ ui.alt={}; ui.ai=null; ui.stage="alt"; render(); window.scrollTo(0,0); }
      else deduct(S.plan);
      break;
    case "altinc": ui.alt[id]=Math.min(+el.dataset.max,(ui.alt[id]||0)+1); render(); break;
    case "altdec": ui.alt[id]=Math.max(0,(ui.alt[id]||0)-1); render(); break;
    case "bakealt": {
      const need=needsFor(ui.alt);
      const short=Object.entries(need).find(([iid,n])=>ING(iid).qty+1e-9<n);
      if(short){ toast(`Not enough ${ING(short[0]).name.toLowerCase()} for all of these. Try fewer batches.`); break; }
      S.plan={...ui.alt}; deduct(S.plan); break; }
    case "aiPrices": askAI("prices"); break;
    case "aiIdeas": askAI("ideas"); break;
    case "home": ui.stage="plan"; render(); window.scrollTo(0,0); break;
    case "pinc": { const i=ING(id); i.qty=Math.round((i.qty+1)*100)/100; save(); render(); break; }
    case "pdec": { const i=ING(id); i.qty=Math.max(0,Math.round((i.qty-1)*100)/100); save(); render(); break; }
    case "newIng": ingDialog(null); break;
    case "editIng": ingDialog(ING(id)); break;
    case "pickEmoji": draft.emoji=el.dataset.e; document.querySelectorAll('[data-act="pickEmoji"]').forEach(b=>b.setAttribute("aria-pressed",b.dataset.e===draft.emoji)); break;
    case "saveIng": {
      const name=$("#f_name").value.trim(); if(!name){ $("#f_name").focus(); toast("Type the ingredient's name"); break; }
      Object.assign(draft,{name,unit:$("#f_unit").value,qty:parseFloat($("#f_qty").value)||0,low:parseFloat($("#f_low").value)||0,price:parseFloat($("#f_price").value)||1});
      const k=S.ingredients.findIndex(x=>x.id===draft.id); if(k>=0) S.ingredients[k]=draft; else S.ingredients.push(draft);
      save(); dlg.close(); render(); toast(`${name} saved`); break; }
    case "delIng":
      if(S.recipes.some(r=>r.items.some(([iid])=>iid===draft.id))){ toast("A recipe still uses this. Change the recipe first."); break; }
      S.ingredients=S.ingredients.filter(x=>x.id!==draft.id); save(); dlg.close(); render(); toast("Removed"); break;
    case "newRec": if(!S.ingredients.length){ toast("Add an ingredient to your pantry first"); break; } recDialog(null); break;
    case "editRec": recDialog(S.recipes.find(r=>r.id===id)); break;
    case "addItem": syncRec(); draft.items.push([S.ingredients[0].id,1]); drawRec(); break;
    case "rmItem": syncRec(); draft.items.splice(+el.dataset.k,1); drawRec(); break;
    case "saveRec": {
      syncRec(); if(!draft.name.trim()){ $("#r_name").focus(); toast("Give the recipe a name"); break; }
      draft.items=draft.items.filter(([,x])=>x>0); if(!draft.items.length){ toast("Add at least one ingredient"); break; }
      const k=S.recipes.findIndex(x=>x.id===draft.id); if(k>=0) S.recipes[k]=draft; else S.recipes.push(draft);
      save(); dlg.close(); render(); toast(`${draft.name} saved`); break; }
    case "delRec": S.recipes=S.recipes.filter(x=>x.id!==draft.id); delete S.plan[draft.id]; save(); dlg.close(); render(); toast("Recipe removed"); break;
    case "closeDlg": dlg.close(); break;
    case "newCust":
      openDlg(`<h2 style="margin-top:0">Add a regular</h2><label class="field">Their name<input id="c_name" placeholder="e.g. Mr. Lee"></label>
        <div class="actions"><button class="btn big" data-act="saveCust">Save</button><button class="btn" data-act="closeDlg">Cancel</button></div>`); break;
    case "saveCust": { const n=$("#c_name").value.trim(); if(!n){ toast("Type their name"); break; }
      S.customers.push({id:uid("c"),name:n,points:0,treats:0}); save(); dlg.close(); render(); break; }
    case "sale": { const c=S.customers.find(x=>x.id===id);
      openDlg(`<h2 style="margin-top:0">${esc(c.name)} bought something</h2><label class="field">How much did they spend? ($)<input id="s_amt" type="number" inputmode="decimal" min="0" step="0.5"></label>
        <div class="actions"><button class="btn big" data-act="saveSale" data-id="${c.id}">Add points</button><button class="btn" data-act="closeDlg">Cancel</button></div>`); break; }
    case "saveSale": { const c=S.customers.find(x=>x.id===id); const amt=parseFloat($("#s_amt").value)||0;
      if(amt<=0){ toast("Type how much they spent"); break; }
      const pts=Math.floor(amt); c.points+=pts; save(); dlg.close(); render();
      toast(c.points>=100?`${c.name} has earned a free treat! 🎁`:`+${pts} points for ${c.name}`); break; }
    case "redeem": { const c=S.customers.find(x=>x.id===id); c.points-=100; c.treats++; save(); render(); toast(`Free treat given to ${c.name}`); break; }
    case "swipe": decide(el.dataset.v); break;
    case "resetDeals": S.deals={}; save(); render(); break;
  }
});
dlg.addEventListener("click",e=>{ if(e.target===dlg) dlg.close(); });
render();
</script>
</body>
</html>
