<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grandma's Bakery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --outer:#F6B3B5; --bar:#141414; --green:#97A957; --cream:#FDEFC4; --paper:#FFF8E2; --white:#FFFDF6;
  --ink:#141414; --line:#141414; --btn:#141414; --btn-ink:#FFF8E2;
  --yellow:#F4B63F; --coral:#E8613F; --pink:#F6B3B5; --peach:#F7C6A3; --leaf:#6E7F34;
  --side:var(--green);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --outer:#3A2628; --bar:#0B0B0B; --green:#56632C; --cream:#1D1A15; --paper:#28241D; --white:#322D25;
    --ink:#FBF1D8; --line:#FBF1D8; --btn:#FBF1D8; --btn-ink:#1D1A15;
    --yellow:#A9791F; --coral:#B04A2E; --pink:#8E5458; --peach:#8C6146; --leaf:#C8E39A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --outer:#3A2628; --bar:#0B0B0B; --green:#56632C; --cream:#1D1A15; --paper:#28241D; --white:#322D25;
  --ink:#FBF1D8; --line:#FBF1D8; --btn:#FBF1D8; --btn-ink:#1D1A15;
  --yellow:#A9791F; --coral:#B04A2E; --pink:#8E5458; --peach:#8C6146; --leaf:#C8E39A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--outer);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:19px;line-height:1.4}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid var(--coral);outline-offset:3px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.disp{font-family:"Archivo Black","Arial Black",Impact,sans-serif;font-weight:400;text-transform:uppercase;line-height:1}

/* frame */
.page{padding:calc(28px + env(safe-area-inset-top,0px)) 16px 40px}
.frame{max-width:1240px;margin:0 auto;border:5px solid #141414;border-radius:34px;overflow:clip;background:var(--cream)}
.navband{background:var(--green);padding:20px 22px}
.navpill{display:flex;align-items:center;gap:12px;background:var(--cream);border-radius:999px;padding:8px 10px 8px 28px}
.logo{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-size:32px;line-height:1;white-space:nowrap}
.tabs{display:flex;gap:4px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.tab{border:none;background:none;border-radius:999px;padding:12px 18px;min-height:48px;font-size:15px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.tab[aria-current="page"]{background:var(--btn);color:var(--btn-ink)}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;margin-left:6px;border-radius:999px;background:#E8613F;color:#141414;font-size:12px;font-weight:700}

/* two columns */
.split{display:grid;grid-template-columns:minmax(min-content,5fr) 8fr}
.side{background:var(--side);padding:44px 36px 48px;position:relative;border-right:2px solid var(--line);min-width:300px}
.side.y{--side:var(--yellow)} .side.p{--side:var(--pink)} .side.c{--side:var(--coral)} .side.pe{--side:var(--peach)}
.side-in{position:sticky;top:28px;z-index:1;display:flex;flex-direction:column;gap:20px;align-items:flex-start}
.deco{position:absolute;top:24px;right:24px;width:96px;height:96px;color:var(--yellow);transform:rotate(12deg)}
.big{font-family:"Archivo Black","Arial Black",Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(46px,5.4vw,78px);line-height:.92;letter-spacing:-.01em;margin:0}
.deco~.side-in .big{padding-top:44px}
.lead{margin:0;font-size:20px}
.main{padding:40px 36px 64px;min-width:0}

/* buttons + bits */
.cta,.ghost{display:inline-flex;align-items:center;justify-content:center;gap:12px;border-radius:999px;padding:16px 34px;min-height:64px;font-size:18px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;text-decoration:none}
.cta{background:var(--btn);color:var(--btn-ink);border:2px solid var(--btn)}
.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.cta:disabled{opacity:.35;cursor:not-allowed}
.cta:active:not(:disabled),.ghost:active{transform:translateY(2px)}
.mini{min-height:52px;padding:10px 22px;font-size:15px}
.back{border:none;background:none;padding:8px 0;font-size:17px;font-weight:600;text-decoration:underline;text-underline-offset:5px}
.btns{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:999px;border:2px solid var(--line);background:var(--white);font-size:15px;font-weight:600;white-space:nowrap}
.chip.low{background:#E8613F;color:#141414;border-color:#141414}
.chip.dark{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.tiny{font-size:15px;margin:0;opacity:.8}
.total{font-family:"Archivo Black",Impact,sans-serif;font-size:clamp(52px,6vw,80px);line-height:1}
.card{background:var(--paper);border:2px solid var(--line);border-radius:28px;padding:16px;position:relative}
.stack{display:flex;flex-direction:column;gap:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.pic{aspect-ratio:4/3;border-radius:20px;overflow:hidden;border:2px solid var(--line);background:var(--white)}
.pic>img,.pic>svg{display:block;width:100%;height:100%;object-fit:cover}

/* recipe cards */
.rc{display:grid;grid-template-columns:minmax(130px,42%) 1fr;gap:24px;align-items:center;transition:box-shadow .15s,transform .15s}
.rc.on{box-shadow:8px 8px 0 var(--line);transform:translate(-4px,-4px)}
.rb{display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0}
.h3{font-family:"Archivo Black","Arial Black",Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(22px,2.3vw,32px);line-height:1;margin:0;overflow-wrap:anywhere}
.mk{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-size:22px;line-height:1.1}
.rb .pill{margin-top:10px}
.rbtn{text-align:left;width:100%;cursor:pointer}
.ems{display:flex;flex-wrap:wrap;gap:6px}
.ems span{display:inline-flex;align-items:center;gap:2px;font-size:14px;font-weight:600;padding:2px 10px 2px 4px;border-radius:999px;background:var(--cream);border:1.5px solid var(--line);white-space:nowrap}
.ems svg{width:26px;height:26px;flex:none}

/* steppers */
.pill{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:999px;padding:5px;background:var(--white)}
.pill button{width:54px;height:54px;border-radius:50%;border:none;background:transparent;font-size:30px;line-height:1;display:grid;place-items:center}
.pill button.add{background:var(--btn);color:var(--btn-ink)}
.pill button:disabled{opacity:.25;cursor:not-allowed}
.pill .n{min-width:64px;text-align:center;font-family:"Archivo Black",Impact,sans-serif;font-size:26px;line-height:1}
.pill .n small{display:block;font-family:"Instrument Sans",sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-top:3px}

/* side: picked list */
.picked{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px}
.pk{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:6px 14px 6px 6px}
.pk .pic{border-radius:12px;border:none}
.pk span{font-weight:600;font-size:17px;line-height:1.15}
.pk b{font-family:"Archivo Black",Impact,sans-serif;font-weight:400;font-size:20px}

/* shopping */
.store{padding:0;overflow:hidden}
.sh{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:2px solid var(--line);background:var(--white)}
.se{width:52px;height:52px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:#FDEFC4;flex:none}
.se svg{width:40px;height:40px}
.sh .h3{font-size:22px;flex:1}
.sh b{font-family:"Archivo Black",Impact,sans-serif;font-weight:400;font-size:22px}
.line{display:grid;grid-template-columns:36px 44px 1fr auto;gap:14px;align-items:center;padding:14px 20px;border-top:1.5px dashed var(--line);cursor:pointer}
.sh+.line{border-top:none}
.line input{width:32px;height:32px;margin:0;accent-color:var(--leaf)}
.line .e svg{display:block;width:44px;height:44px}
.line .pr{font-family:"Archivo Black",Impact,sans-serif;font-weight:400;font-size:22px}
.line.off{opacity:.45}
.line.off .pr{text-decoration:line-through}

/* live */
.today{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;width:100%;max-width:340px;font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.field input,.field select{border:2px solid var(--line);border-radius:16px;padding:12px 16px;min-height:56px;width:100%;background:var(--paper);font-size:19px;font-weight:500;text-transform:none;letter-spacing:0}

/* pantry */
.ing{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.ing.low{border:3px solid #E8613F}
.it{display:flex;justify-content:space-between;align-items:flex-start;width:100%}
.bub{width:68px;height:68px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.bub svg{width:84%;height:84%}
.nm{border:none;background:none;padding:0;text-align:left;font-weight:700;font-size:19px;line-height:1.2;text-decoration:underline dotted;text-underline-offset:5px}
.ing .pill{width:100%;justify-content:space-between}

/* regulars */
.cust{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 20px;align-items:center;padding:20px 22px;min-width:0}
.cust .h3{grid-column:1;grid-row:1;overflow-wrap:break-word;font-size:clamp(20px,2vw,28px)}
.cust .chip{grid-column:2;grid-row:1;justify-self:end}
.cust .meter{grid-column:1/-1;grid-row:2}
.cust .pts{grid-column:1;grid-row:3}
.cust .btns{grid-column:2;grid-row:3;justify-content:flex-end}
.meter{height:24px;width:100%;border:2px solid var(--line);border-radius:999px;overflow:hidden;background:var(--white)}
.meter i{display:block;height:100%;background:var(--green)}
.pts{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:17px}
.pts b{font-family:"Archivo Black",Impact,sans-serif;font-weight:400;font-size:30px}

/* stores */
.deck{position:relative;height:480px;max-width:400px;margin:0 auto}
.swipe{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;touch-action:none;user-select:none;transition:transform .25s ease}
.swipe.behind{transform:scale(.94) translateY(20px) rotate(-3deg);z-index:0;background:var(--white)}
.swipe.top{z-index:1;box-shadow:8px 8px 0 var(--line)}
.sw-s{display:flex;align-items:center;gap:10px;font-family:"Archivo Black",Impact,sans-serif;text-transform:uppercase;font-size:22px}
.sw-s span svg{display:block;width:44px;height:44px}
.sw-e{width:150px;height:150px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;margin:10px 0}
.sw-e svg{width:82%;height:82%}
.sw-n{font-weight:600}
.sw-p{font-family:"Archivo Black",Impact,sans-serif;font-size:56px;line-height:1}
.stamp{position:absolute;top:24px;font-family:"Archivo Black",Impact,sans-serif;font-size:26px;letter-spacing:.08em;border:3px solid;border-radius:12px;padding:2px 14px;opacity:0}
.stamp.yes{left:22px;color:#2F5A12;background:#DDEFC0;transform:rotate(-12deg)}
.stamp.nope{right:22px;color:#8A2A12;background:#FAD3C4;transform:rotate(12deg)}
.swbtns{display:flex;justify-content:center;gap:36px;margin-top:32px}
.rnd{width:88px;height:88px;border-radius:50%;border:2px solid var(--line);background:var(--paper);font-size:34px;display:grid;place-items:center}
.rnd.yes{background:var(--btn);color:var(--btn-ink)}
.kept{margin-top:40px;display:flex;flex-direction:column;gap:10px}
.krow{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:10px 18px;border-radius:20px}
.krow .e svg{display:block;width:48px;height:48px}

/* dialogs */
dialog{border:3px solid var(--line);border-radius:30px;background:var(--cream);color:var(--ink);padding:0;width:min(640px,94vw);max-height:90vh;box-shadow:10px 10px 0 #141414}
dialog::backdrop{background:rgba(20,20,20,.5)}
.dlg{padding:28px;overflow:auto;max-height:86vh;display:flex;flex-direction:column;gap:16px}
.dlg h2{font-family:"Archivo Black",Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:30px;line-height:1;margin:0}
.dlg .field{max-width:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.icons button{height:64px;padding:6px;border:3px solid transparent;border-radius:14px;background:#FDEFC4}
.icons button svg{display:block;width:100%;height:100%}
.icons button[aria-pressed="true"]{border-color:var(--line)}
.arts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.arts button{padding:0;border:3px solid transparent;border-radius:14px;overflow:hidden;aspect-ratio:4/3;background:none}
.arts button svg{display:block;width:100%;height:100%}
.arts button[aria-pressed="true"]{border-color:var(--line)}
.pv{width:min(280px,100%)}
.photo:focus-within{outline:4px solid var(--coral);outline-offset:3px}
.irow{display:grid;grid-template-columns:1fr 110px 56px;gap:10px;align-items:center}
.irow select,.irow input{border:2px solid var(--line);border-radius:14px;padding:10px;min-height:56px;width:100%;background:var(--paper)}
.x{width:56px;height:56px;border-radius:50%;border:2px solid var(--line);background:var(--paper);font-size:20px}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);padding:14px 28px;border-radius:999px;font-weight:600;z-index:20;max-width:90vw;text-align:center}

@media (max-width:880px){
  .split{grid-template-columns:1fr}
  .side{border-right:none;border-bottom:2px solid var(--line);padding:28px 20px}
  .side-in{position:static}
  .big{font-size:clamp(40px,11vw,60px)}
  .deco~.side-in .big{padding-top:8px}
  .side{min-width:0}
  .deco{width:72px;height:72px;top:18px;right:18px}
  .main{padding:26px 16px 130px}
  .dockable{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;box-shadow:0 8px 24px rgba(0,0,0,.3)}
  .picked{max-width:none}
}
@media (max-width:720px){
  .page{padding:calc(14px + env(safe-area-inset-top,0px)) 12px 30px}
  .frame{border-width:4px;border-radius:26px}
  .navband{padding:14px}
  .navpill{flex-wrap:wrap;border-radius:26px;padding:12px 12px 8px 18px}
  .tabs{order:3;width:100%;margin:0}
  .tab{padding:10px 12px;font-size:14px}
  .rc{grid-template-columns:110px 1fr;gap:14px;padding:12px}
  .rc .pic{border-radius:14px}
  .mk{font-size:18px}
  .pill button{width:48px;height:48px;font-size:26px}
  .pill .n{min-width:48px;font-size:22px}
  .two{grid-template-columns:1fr}
  .irow{grid-template-columns:1fr 84px 52px}
  .arts{grid-template-columns:repeat(4,1fr)}
  .line{grid-template-columns:32px 36px 1fr;padding:12px 16px}
  .line .pr{grid-column:3}
  .line .e svg{width:36px;height:36px}
  .sw-e{width:120px;height:120px}
  .deck{height:440px}
  .grid{grid-template-columns:1fr 1fr;gap:12px}
  .bub{width:56px;height:56px;font-size:30px}
}
@media (max-width:460px){
  .grid{grid-template-columns:1fr}
  .cust .chip{grid-column:1/-1;grid-row:auto;justify-self:start}
  .cust .meter,.cust .pts,.cust .btns{grid-column:1/-1;grid-row:auto}
  .cust .btns{justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){
  .swipe,.rc{transition:none}
}
</style>
</head>
<body>
<div class="page"><div class="frame">
  <div class="navband"><div class="navpill">
    <div class="logo">Grandma's Bakery</div>
    <nav class="tabs" aria-label="Sections"></nav>
  </div></div>
  <main id="app"></main>
</div></div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

<script>
/* ---------- starter data ---------- */
const DEFAULTS = {

    {id:"honey",name:"Honey",emoji:"🍯",unit:"tbsp",qty:16,low:4,price:0.20},
    {id:"condensed",name:"Sweetened condensed milk",emoji:"🥫",unit:"cups",qty:1.25,low:1,price:2.00},

    {id:"strawberries",name:"Fresh strawberries",emoji:"🍓",unit:"lbs",qty:1,low:1,price:3.00},
    {id:"graham",name:"Graham cracker crumbs",emoji:"🍪",unit:"cups",qty:1.5,low:1,price:0.80},
    {id:"creamcheese",name:"Cream cheese",emoji:"🧀",unit:"8-oz blocks",qty:2,low:2,price:2.50},
    {id:"hazelnuts",name:"Skinned hazelnuts",emoji:"🌰",unit:"cups",qty:1,low:0.5,price:2.50},
    {id:"pumpkin",name:"Canned pumpkin purée",emoji:"🎃",unit:"cups",qty:1.75,low:1,price:0.90},
    {id:"sourcream",name:"Sour cream",emoji:"🥛",unit:"tbsp",qty:8,low:2,price:0.15},
    {id:"ginger",name:"Ground ginger",emoji:"🫚",unit:"tsp",qty:5,low:2,price:0.25},
    {id:"cloves",name:"Ground cloves",emoji:"🪵",unit:"tsp",qty:3,low:1,price:0.30},
    {id:"nutmeg",name:"Ground nutmeg",emoji:"🌰",unit:"tsp",qty:3,low:1,price:0.30},
    {id:"rum",name:"Dark rum",emoji:"🥃",unit:"tsp",qty:24,low:3,price:0.20}

function load(){
  try{ const raw=localStorage.getItem("grandma-bakery"); if(raw) return restore(Object.assign(structuredClone(DEFAULTS),JSON.parse(raw))); }catch(e){}
  return restore(structuredClone(DEFAULTS));
}
// One-time: bring back built-in recipes missing from saved data (and the pantry items they use).
function restore(st){
  if((st.v||1)>=2) return st;
  for(const rid of ["parfait","falltart"]){
    const r=DEFAULTS.recipes.find(x=>x.id===rid);
    if(!r||st.recipes.some(x=>x.id===rid)) continue;
    st.recipes.push(structuredClone(r));
    for(const [iid] of r.items){
      const i=DEFAULTS.ingredients.find(x=>x.id===iid);
      if(i&&!st.ingredients.some(x=>x.id===iid)) st.ingredients.push(structuredClone(i));
    }
  }
  st.v=2;
  return st;
}
function save(){
  try{ localStorage.setItem("grandma-bakery",JSON.stringify(S)); }catch(e){ toast("Couldn't save. Try a smaller photo."); }
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{ if(docRef){ try{ await docRef.set({state:JSON.stringify(S)}); }catch(e){} } },900);
}
(async()=>{
  if(!window.claude||!window.claude.use) return;
  try{
    db = await window.claude.use("db");
    const user = await window.claude.use("user");
    if(db && user){
      const id = await user.id();
      if(id){
        docRef = db.collection("data/users/"+id).doc("bakery");
        const snap = await docRef.get();
        if(snap.exists && snap.data() && snap.data().state){
          S = restore(Object.assign(structuredClone(DEFAULTS), JSON.parse(snap.data().state)));
        } else { await docRef.set({state:JSON.stringify(S)}); }
      }
    }
  }catch(e){}

})();

function qty(n){
  n=Math.round(n*100)/100; if(n<=0) return "0";
  const w=Math.floor(n), f=Math.round((n-w)*100);
  const m={25:"¼",50:"½",75:"¾",33:"⅓",67:"⅔"};
  if(f===0) return String(w);
  if(m[f]) return (w?w:"")+m[f];
  return n.toFixed(1).replace(/\.0$/,"");
}
const today=()=>new Date().toISOString().slice(0,10);

function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h}
function priceAt(sup,ing){
  const f=FRESH.includes(ing.id)?sup.fresh:sup.base;
  const wobble=0.92+(hash(sup.id+ing.id)%17)/100;
  return Math.max(0.01,Math.round((ing.price||1)*f*wobble*100)/100);
}
function bestDeal(ing){
  const ok=SUPPLIERS.filter(s=>S.deals[s.id+"|"+ing.id]!=="skip");
  const pool=(ok.filter(s=>S.deals[s.id+"|"+ing.id]==="like").length?ok.filter(s=>S.deals[s.id+"|"+ing.id]==="like"):ok);
  const list=(pool.length?pool:SUPPLIERS).map(s=>({s,p:priceAt(s,ing)})).sort((a,b)=>a.p-b.p);
  return list[0];
}
function avgPrice(ing){ return SUPPLIERS.reduce((a,s)=>a+priceAt(s,ing),0)/SUPPLIERS.length; }
function needsFor(plan){
  const need={};
  for(const [rid,n] of Object.entries(plan)){
    if(!n) continue; const r=S.recipes.find(x=>x.id===rid); if(!r) continue;
    for(const [iid,a] of r.items){ need[iid]=(need[iid]||0)+a*n; }
  }
  return need;
}
function maxBatches(r){
  let m=Infinity;
  for(const [iid,a] of r.items){ const i=ING(iid); if(!i||a<=0) continue; m=Math.min(m,Math.floor((i.qty+1e-9)/a)); }
  return m===Infinity?0:m;
}

function starD(cx,cy,r,n,rot=0,inner=.36){
  let d="";
  for(let i=0;i<n*2;i++){ const a=rot+i*Math.PI/n-Math.PI/2, rr=i%2?r*inner:r; d+=(i?"L":"M")+(cx+rr*Math.cos(a)).toFixed(1)+" "+(cy+rr*Math.sin(a)).toFixed(1); }
  return d+"Z";
}

function readPhoto(file){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const s=Math.min(1,640/Math.max(img.width,img.height)), c=document.createElement("canvas");
      c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg",0.8));
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(); };
    img.src=url;
  });
}

function buildCart(){
  const need=needsFor(S.plan), cart=[];
  for(const [iid,n] of Object.entries(need)){
    const i=ING(iid); if(!i) continue;
    const short=Math.max(0,n-i.qty);
    if(short>0){
      const buy=Math.ceil(short);
      const d=bestDeal(i);
      cart.push({iid,buy,sup:d.s.id,unit:d.p,total:Math.round(buy*d.p*100)/100,avg:Math.round(buy*avgPrice(i)*100)/100,required:short>0,on:true});
    }
  }
  return cart;
}

        <button data-act="pdec" data-id="${i.id}" aria-label="Use one ${esc(i.unit)}" ${i.qty<=0?"disabled":""}>−</button>
        <span class="n">${qty(i.qty)}<small>${esc(i.unit)}</small></span>
        <button class="add" data-act="pinc" data-id="${i.id}" aria-label="Add one ${esc(i.unit)}">+</button>
      </div></div>`;}).join("")}</div>`;
  return split("",side,main);
}

function recipesHTML(){
  const side=`<h1 class="big">Recipes</h1><span class="chip">${S.recipes.length}</span>
    <button class="cta" data-act="newRec">+ New</button>`;
  const main=`<div class="stack">${S.recipes.map(r=>`<button class="card rc rbtn" data-act="editRec" data-id="${r.id}" aria-label="Edit ${esc(r.name)}">
      <div class="pic">${pic(r)}</div>
      <div class="rb"><h3 class="h3">${esc(r.name)}</h3><div class="mk">${esc(r.makes)}</div>
      <div class="ems">${r.items.map(([iid,a])=>{const i=ING(iid);return i?`<span title="${esc(i.name)}">${ingIcon(i)}${qty(a)}</span>`:""}).join("")}</div></div>
    </button>`).join("")}</div>`;
  return split("pe",side,main);
}

function customersHTML(){
  const side=`<h1 class="big">Regulars</h1><p class="lead">1 point per dollar.<br>100 points = a free treat.</p>
    <button class="cta" data-act="newCust">+ Add</button>`;
  const main=`<div class="stack">${S.customers.map(c=>{const p=Math.min(100,c.points);
    return `<div class="card cust">
      <h3 class="h3">${esc(c.name)}</h3>
      ${c.treats?`<span class="chip">${c.treats} free treat${c.treats>1?"s":""}</span>`:""}
      <div class="meter" role="img" aria-label="${c.points} of 100 points"><i style="width:${p}%"></i></div>
      <div class="pts"><b>${c.points}</b> of 100 points</div>
      <div class="btns">
        <button class="ghost mini" data-act="sale" data-id="${c.id}">+ Sale</button>
        ${c.points>=100?`<button class="cta mini" data-act="redeem" data-id="${c.id}">Give treat</button>`:""}
      </div></div>`;}).join("")}</div>`;
  return split("p",side,main);
}

function deckList(){
  const out=[];
  for(const i of S.ingredients) for(const s of SUPPLIERS){ if(!S.deals[s.id+"|"+i.id]) out.push({s,i,p:priceAt(s,i)}); }
  return out;
}
function suppliersHTML(){
  const deck=deckList();
  const kept=Object.entries(S.deals).filter(([,v])=>v==="like").map(([k])=>{const [sid,iid]=k.split("|");return {s:SUPPLIERS.find(x=>x.id===sid),i:ING(iid)}}).filter(x=>x.s&&x.i);
  const card=(d,cls)=>{const cheapest=SUPPLIERS.every(s=>priceAt(s,d.i)>=d.p);
    return `<div class="card swipe ${cls}" ${cls==="top"?'id="topcard"':""}>
      <span class="stamp yes">KEEP</span><span class="stamp nope">SKIP</span>
      <div class="sw-s"><span aria-hidden="true">${storeIcon(d.s)}</span>${esc(d.s.name)}</div>
      <div class="sw-e" aria-hidden="true" style="background:${tint(d.i.id)}">${ingIcon(d.i)}</div>
      <div class="sw-n">${esc(d.i.name)}</div>
      <div class="sw-p">${money(d.p)}</div><div class="tiny">per ${esc(d.i.unit.replace(/s$/,""))}</div>
      ${cheapest?`<span class="chip dark">Cheapest</span>`:""}</div>`;};
  const side=`<h1 class="big">Stores</h1><p class="lead">Swipe right to keep a store, left to skip it.</p>
    ${deck.length?`<span class="chip">${deck.length} left</span>`:""}
    ${Object.keys(S.deals).length?`<button class="ghost mini" data-act="resetDeals">Start over</button>`:""}`;
  const main=`${deck.length?`<div class="deck">${deck[1]?card(deck[1],"behind"):""}${card(deck[0],"top")}</div>
    <div class="swbtns"><button class="rnd" data-act="swipe" data-v="skip" aria-label="Skip">✖</button><button class="rnd yes" data-act="swipe" data-v="like" aria-label="Keep">♥</button></div>`
    :`<div class="card"><h3 class="h3">All done!</h3></div>`}
    ${kept.length?`<div class="kept"><h3 class="h3">Kept</h3>${kept.map(k=>`<div class="card krow"><span class="e" aria-hidden="true">${ingIcon(k.i)}</span><div><b>${esc(k.i.name)}</b><div class="tiny">${esc(k.s.name)} ·${money(priceAt(k.s,k.i))}</div></div><span class="chip">Kept</span></div>`).join("")}</div>`:""}`;
  return split("y",side,main);
}

/* ---------- swipe gestures ---------- */
function wireSwipe(){
  const el=$("#topcard"); if(!el) return;
  let x0=null,dx=0;
  el.addEventListener("pointerdown",e=>{x0=e.clientX;el.setPointerCapture(e.pointerId);el.style.transition="none"});
  el.addEventListener("pointermove",e=>{if(x0===null)return;dx=e.clientX-x0;el.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;
    el.querySelector(".yes").style.opacity=Math.max(0,dx/120);el.querySelector(".nope").style.opacity=Math.max(0,-dx/120)});
  const end=()=>{if(x0===null)return;x0=null;el.style.transition="";
    if(Math.abs(dx)>110) decide(dx>0?"like":"skip"); else {el.style.transform="";el.querySelectorAll(".stamp").forEach(s=>s.style.opacity=0)} dx=0};
  el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);
}
function decide(v){
  const d=deckList()[0]; if(!d) return;
  const el=$("#topcard");
  if(el){ el.style.transform=`translateX(${v==="like"?600:-600}px) rotate(${v==="like"?25:-25}deg)`; }
  setTimeout(()=>{S.deals[d.s.id+"|"+d.i.id]=v;save();render();},200);
}

/* ---------- baking ---------- */
function deduct(plan){
  const need=needsFor(plan);
  for(const [iid,n] of Object.entries(need)){ const i=ING(iid); if(i) i.qty=Math.max(0,Math.round((i.qty-n)*100)/100); }
  ui.lastBake=Object.entries(plan).filter(([,n])=>n).map(([rid,n])=>{const r=S.recipes.find(x=>x.id===rid);return r?{id:r.id,emoji:r.emoji,name:r.name,n}:null}).filter(Boolean);
  S.plan={}; save();
  ui.stage="live"; render(); window.scrollTo(0,0);
}

/* ---------- dialogs ---------- */
const dlg=$("#dlg");
function openDlg(html){ $("#dlgBody").innerHTML=html; if(!dlg.open) dlg.showModal(); }
function iconPicker(d){ const sel=iconKind(d); return `<div class="icons" role="group" aria-label="Pick a picture">${ICON_KINDS.map(k=>`<button type="button" data-act="pickIcon" data-k="${k}" aria-pressed="${k===sel}" aria-label="${k}">${ingIcon(d,k)}</button>`).join("")}</div>`; }
let draft=null;
function ingDialog(i){
  draft={...(i||{id:uid("i"),name:"",emoji:"🌾",unit:"cups",qty:0,low:2,price:1})};
  openDlg(`<h2>${i?"Edit":"New"} ingredient</h2>
    ${iconPicker(draft)}
    <label class="field">Name<input id="f_name" value="${esc(draft.name)}" placeholder="e.g. Unsalted butter"></label>
    <div class="two"><label class="field">Have<input id="f_qty" type="number" inputmode="decimal" min="0" step="0.25" value="${draft.qty}"></label>
    <label class="field">Unit<select id="f_unit">${["cups","sticks","eggs","tsp","tbsp","lbs","bags","jars",draft.unit].filter((v,k,a)=>a.indexOf(v)===k).map(u=>`<option ${u===draft.unit?"selected":""}>${esc(u)}</option>`).join("")}</select></label></div>
    <div class="two"><label class="field">Warn below<input id="f_low" type="number" inputmode="decimal" min="0" step="0.25" value="${draft.low}"></label>
    <label class="field">Price each ($)<input id="f_price" type="number" inputmode="decimal" min="0" step="0.05" value="${draft.price}"></label></div>
    <div class="btns"><button class="cta" data-act="saveIng">Save</button><button class="ghost" data-act="closeDlg">Cancel</button>
    ${i?`<button class="back" data-act="delIng">Remove</button>`:""}</div>`);
}
function recDialog(r){
  draft={...(r?structuredClone(r):{id:uid("r"),name:"",emoji:"🍰",makes:"1 batch",items:[[S.ingredients[0]?.id,1]]})};
  drawRec();
}
function drawRec(){
  const exists=S.recipes.some(x=>x.id===draft.id), k=artKind(draft);
  openDlg(`<h2>${exists?"Edit":"New"} recipe</h2>
    <div class="pic pv">${pic(draft)}</div>
    <div class="arts" role="group" aria-label="Picture">${ARTS.map(a=>`<button type="button" data-act="pickArt" data-k="${a}" aria-pressed="${!draft.img&&k===a}" aria-label="${a}">${art({...draft,art:a})}</button>`).join("")}</div>
    <div class="btns"><label class="ghost mini photo">Use a photo<input type="file" id="r_photo" accept="image/*" class="vh"></label>
    ${draft.img?`<button class="back" data-act="rmPhoto">Remove photo</button>`:""}</div>
    <label class="field">Name<input id="r_name" value="${esc(draft.name)}" placeholder="e.g. Sugar cookies"></label>
    <label class="field">Makes<input id="r_makes" value="${esc(draft.makes)}" placeholder="e.g. 24 cookies"></label>
    <div class="field">Ingredients · 1 batch</div>
    ${draft.items.map(([iid,a],k)=>`<div class="irow"><select data-k="${k}" class="r_ing" aria-label="Ingredient">${S.ingredients.map(i=>`<option value="${i.id}" ${i.id===iid?"selected":""}>${esc(i.name)} (${esc(i.unit)})</option>`).join("")}</select>
      <input class="r_amt" data-k="${k}" type="number" inputmode="decimal" min="0" step="0.25" value="${a}" aria-label="Amount"><button class="x" data-act="rmItem" data-k="${k}" aria-label="Remove">✖</button></div>`).join("")}
    <div><button class="back" data-act="addItem">+ Ingredient</button></div>
    <div class="btns"><button class="cta" data-act="saveRec">Save</button><button class="ghost" data-act="closeDlg">Cancel</button>
    ${exists?`<button class="back" data-act="delRec">Remove</button>`:""}</div>`);
}
function syncRec(){
  const n=$("#r_name"); if(n) draft.name=n.value; const m=$("#r_makes"); if(m) draft.makes=m.value;
  document.querySelectorAll(".r_ing").forEach(s=>draft.items[+s.dataset.k][0]=s.value);
  document.querySelectorAll(".r_amt").forEach(s=>draft.items[+s.dataset.k][1]=parseFloat(s.value)||0);
}

/* ---------- events ---------- */
document.addEventListener("change",e=>{
  if(e.target.matches('[data-act="cartToggle"]')){ ui.cart[+e.target.dataset.k].on=e.target.checked; render(); }
  if(e.target.id==="chan"){ S.channel=e.target.value.trim().replace(/[^A-Za-z0-9_]/g,"")||"bakingwgranny"; save(); render(); }
  if(e.target.id==="r_photo"){
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    syncRec(); readPhoto(f).then(d=>{ draft.img=d; drawRec(); }).catch(()=>toast("Couldn't read that photo"));
  }
});
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act, id=el.dataset.id;
  if(a==="cartToggle"||a==="chan") return;
  switch(a){
    case "tab": ui.tab=id; if(id==="bake"&&ui.stage==="live") ui.stage="plan"; render(); window.scrollTo(0,0); break;
    case "inc": S.plan[id]=(S.plan[id]||0)+1; save(); render(); break;
    case "dec": S.plan[id]=Math.max(0,(S.plan[id]||0)-1); save(); render(); break;
    case "letsbake": ui.cart=buildCart(); ui.stage="check"; render(); window.scrollTo(0,0); break;
    case "back": ui.stage="plan"; render(); break;
    case "backcheck": ui.stage="check"; render(); break;
    case "startbake": deduct(S.plan); break;
    case "buy": {
      const lines=ui.cart.filter(c=>c.on);
      for(const c of lines){ const i=ING(c.iid); i.qty=Math.round((i.qty+c.buy)*100)/100; }
      S.orders.push({date:today(),items:lines.map(c=>({item:ING(c.iid).name,amount:c.buy,store:c.sup,cost:c.total})),total:lines.reduce((x,c)=>x+c.total,0)});
      const stillShort=Object.entries(needsFor(S.plan)).some(([iid,n])=>ING(iid).qty+1e-9<n);
      toast("Ordered and added to pantry");
      if(stillShort){ ui.cart=buildCart(); render(); toast("Still missing something. Tick it or tap Not today."); }
      else deduct(S.plan);
      break; }
    case "nobuy":
      if(ui.cart.some(c=>c.required)){ ui.alt={}; ui.stage="alt"; render(); window.scrollTo(0,0); }
      else deduct(S.plan);
      break;
    case "altinc": ui.alt[id]=Math.min(+el.dataset.max,(ui.alt[id]||0)+1); render(); break;
    case "altdec": ui.alt[id]=Math.max(0,(ui.alt[id]||0)-1); render(); break;
    case "bakealt": {
      const need=needsFor(ui.alt);
      const short=Object.entries(need).find(([iid,n])=>ING(iid).qty+1e-9<n);
      if(short){ toast(`Not enough ${ING(short[0]).name.toLowerCase()}. Try fewer.`); break; }
      S.plan={...ui.alt}; deduct(S.plan); break; }
    case "home": ui.stage="plan"; render(); window.scrollTo(0,0); break;
    case "pinc": { const i=ING(id); i.qty=Math.round((i.qty+1)*100)/100; save(); render(); break; }
    case "pdec": { const i=ING(id); i.qty=Math.max(0,Math.round((i.qty-1)*100)/100); save(); render(); break; }
    case "newIng": ingDialog(null); break;
    case "editIng": ingDialog(ING(id)); break;
    case "pickIcon": draft.icon=el.dataset.k; document.querySelectorAll('[data-act="pickIcon"]').forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===draft.icon)); break;
    case "saveIng": {
      const name=$("#f_name").value.trim(); if(!name){ $("#f_name").focus(); toast("Type a name"); break; }
      Object.assign(draft,{name,unit:$("#f_unit").value,qty:parseFloat($("#f_qty").value)||0,low:parseFloat($("#f_low").value)||0,price:parseFloat($("#f_price").value)||1});
      const k=S.ingredients.findIndex(x=>x.id===draft.id); if(k>=0) S.ingredients[k]=draft; else S.ingredients.push(draft);
      save(); dlg.close(); render(); toast(`${name} saved`); break; }
    case "delIng":
      if(S.recipes.some(r=>r.items.some(([iid])=>iid===draft.id))){ toast("A recipe still uses this"); break; }
      S.ingredients=S.ingredients.filter(x=>x.id!==draft.id); save(); dlg.close(); render(); toast("Removed"); break;
    case "newRec": if(!S.ingredients.length){ toast("Add an ingredient first"); break; } recDialog(null); break;
    case "editRec": recDialog(S.recipes.find(r=>r.id===id)); break;
    case "pickArt": syncRec(); draft.art=el.dataset.k; delete draft.img; drawRec(); break;
    case "rmPhoto": syncRec(); delete draft.img; drawRec(); break;
    case "addItem": syncRec(); draft.items.push([S.ingredients[0].id,1]); drawRec(); break;
    case "rmItem": syncRec(); draft.items.splice(+el.dataset.k,1); drawRec(); break;
    case "saveRec": {
      syncRec(); if(!draft.name.trim()){ $("#r_name").focus(); toast("Give it a name"); break; }
      draft.items=draft.items.filter(([,x])=>x>0); if(!draft.items.length){ toast("Add an ingredient"); break; }
      const k=S.recipes.findIndex(x=>x.id===draft.id); if(k>=0) S.recipes[k]=draft; else S.recipes.push(draft);
      save(); dlg.close(); render(); toast(`${draft.name} saved`); break; }
    case "delRec": S.recipes=S.recipes.filter(x=>x.id!==draft.id); delete S.plan[draft.id]; save(); dlg.close(); render(); toast("Removed"); break;
    case "closeDlg": dlg.close(); break;
    case "newCust":
      openDlg(`<h2>New regular</h2><label class="field">Name<input id="c_name" placeholder="e.g. Mr. Lee"></label>
        <div class="btns"><button class="cta" data-act="saveCust">Save</button><button class="ghost" data-act="closeDlg">Cancel</button></div>`); break;
    case "saveCust": { const n=$("#c_name").value.trim(); if(!n){ toast("Type a name"); break; }
      S.customers.push({id:uid("c"),name:n,points:0,treats:0}); save(); dlg.close(); render(); break; }
    case "sale": { const c=S.customers.find(x=>x.id===id);
      openDlg(`<h2>${esc(c.name)}</h2><label class="field">Spent ($)<input id="s_amt" type="number" inputmode="decimal" min="0" step="0.5"></label>
        <div class="btns"><button class="cta" data-act="saveSale" data-id="${c.id}">Add points</button><button class="ghost" data-act="closeDlg">Cancel</button></div>`); break; }
    case "saveSale": { const c=S.customers.find(x=>x.id===id); const amt=parseFloat($("#s_amt").value)||0;
      if(amt<=0){ toast("Type an amount"); break; }
      const pts=Math.floor(amt); c.points+=pts; save(); dlg.close(); render();
      toast(c.points>=100?`${c.name} earned a free treat!`:`+${pts} points for ${c.name}`); break; }
    case "redeem": { const c=S.customers.find(x=>x.id===id); c.points-=100; c.treats++; save(); render(); toast(`Free treat given to ${c.name}`); break; }
    case "swipe": decide(el.dataset.v); break;
    case "resetDeals": S.deals={}; save(); render(); break;
  }
});
dlg.addEventListener("click",e=>{ if(e.target===dlg) dlg.close(); });
render();
</script>
</body>
</html>
